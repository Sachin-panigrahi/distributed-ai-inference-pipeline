syntax = "proto3";

service Detector {
    rpc DetectObjects (ImageRequest) returns (DetectionResponse);
}

message ImageRequest {
    bytes image = 1;
}

message Detection {
    string class_name = 1;
    float confidence = 2;

    int32 x1 = 3;
    int32 y1 = 4;
    int32 x2 = 5;
    int32 y2 = 6;
}

message DetectionResponse {
    repeated Detection detections = 1;
}